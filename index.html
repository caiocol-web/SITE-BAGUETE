<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">

    <title>Site baguete</title>
</head>

<body>
    <main class="container">
        <form>
            <h1>Login de Usuário</h1>
            <div class="input-box">
                <i class='bx bx-user'></i>
                <input type="text" id="login" placeholder="Digite seu Usuário">
            </div>

            <div class="input-box">
                <input type="password" id="senha" placeholder="Digite sua senha">
                <i class='bx bx-show' id="btn-senha" onclick="mostrarsenha()"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="Lembre-me">
                    Lembrar senha
                </label>
                <a href="#" onclick="trocarsenha()">Esqueceu a senha?</a>
            </div>
            <input type="button" class="login" value="Entrar" onclick="logar()">


            <div class="register-link">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </form>

        <script>

function trocarsenha() {

    let novaSenha = prompt("Digite a nova senha:");

    if (novaSenha != null && novaSenha != "") {
        localStorage.setItem("senha", novaSenha);
        alert("Senha alterada com sucesso!");
    }

}



window.onload = function () {
    if (localStorage.getItem("lembrar") === "true") {
        document.getElementById("login").value = localStorage.getItem("login");
        document.getElementById("senha").value = localStorage.getItem("senha");
        document.getElementById("Lembre-me").checked = true;
    }
}

  function logar () {
var login = document.getElementById('login').value;
var senha = document.getElementById('senha').value;
const lembrar = document.getElementById("Lembre-me").checked;

 if (lembrar) {
        localStorage.setItem("lembrar", "true");
        localStorage.setItem("login", login);
    } else {
        localStorage.removeItem("lembrar");
        localStorage.removeItem("login");
    }
  

let senhaSalva = localStorage.getItem("senha");

if (senhaSalva == null) {
    senhaSalva = "123";
}

if (login == "admin" && senha == senhaSalva) {
    location.href = "home.html";
} else {

    alert("Usuário ou senha incorretos");
}
  }

        </script>
    </main>
<script>
    function mostrarsenha() {
    const input= document.getElementById('senha')
    const icone = document.getElementById('btn-senha')
    

    if(input.type === 'password'){
        input.type ="text"
        icone.classList.remove("bx-show");
        icone.classList.add("bx-hide");
    }
    else{
        input.type = "password"
        icone.classList.remove("bx-hide");
        icone.classList.add("bx-show")
    }

}
</script>
</body>

</html>
