</head>


<body>

            Arte em <br> Baguetes

        <img src="./imgs/logo-sem-fundo.png" alt="Logo">

        <p>Baguete</p>

    <form id="formPesquisa" class="pesquisa">

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar"
        >
    </form>


    <div class="grupo-entradas">

        <div class="entrada">

            <a href="padaria.html" class="btn-entrar">
            <img src="./imgs/pão-1.jpg" alt="Receitas">
            <p>Receitas</p>
        </a>
    </div>

    <div class="entrada">
        <a href="vendas.html" class="btn-entrar">
            <img src="./imgs/pão-2.jpg" alt="Vendas">
            <p>Vendas</p>
        </a>
    </div>

    <div class="entrada">
        <a href="" class="btn-entrar">

    <div class="entrada">
        <a href="" class="btn-entrar">
            <img src="./imgs/pães-2.jpg" alt="Locais">

    </div>

    <div class="entrada" id="opcaoEstoque">

            <img src="./imgs/67.jpg" alt="Estoque">

        </a>


        </div>


    </div>


    <div
        class="centro"

    >

    </div>


    <script>

        const tipoUsuario = localStorage.getItem("tipoUsuario");

        const opcaoEstoque =
            document.getElementById("opcaoEstoque");

        if (tipoUsuario !== "admin") {

            opcaoEstoque.style.display = "none";

        }

        const form =
            document.getElementById("formPesquisa");

        const pesquisa =
            document.getElementById("pesquisa");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            console.log("Pesquisando:", pesquisa.value);

            pesquisa.value = "";

        });

    </script>
